[project]
name = "nmap-mcp"
version = "0.1.0"
description = "MCP server for nmap port scanning and network reconnaissance"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[project.scripts]
nmap-mcp = "nmap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmap_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
